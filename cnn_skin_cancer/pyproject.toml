[tool.poetry]
name = "skcacnn"
version = "0.2.0"
description = "CNN skin cancer classification — Airflow DAGs and model source"
authors = ["Sebastian Blum <sebast.blum@gmail.com>"]
readme = "README.md"
packages = [{include = "src/*"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
tqdm = "^4.67.0"
mlflow = "^2.19.0"
pandas = "^2.2.0"
tensorflow = "^2.17.0"
keras = "^3.7.0"
boto3 = "^1.37.0"
s3fs = "^2024.10.0"
numpy = "^1.26.0"
apache-airflow = "3.0.1"
apache-airflow-providers-amazon = "^9.4.0"
apache-airflow-providers-cncf-kubernetes = "^10.4.0"
apache-airflow-providers-docker = "^4.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
ruff = "^0.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
